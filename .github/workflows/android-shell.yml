name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "要加载的自部署站点地址（https://…）"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    # 签名信息只来自 GitHub Actions Secrets；仓库、源码、构建日志中都不保存密钥本体。
    env:
      SHELLKEYSTOREBASE64: ${{ secrets.SHELLKEYSTOREBASE64 }}
      SHELLKEYSTOREPASSWORD: ${{ secrets.SHELLKEYSTOREPASSWORD }}
      SHELLKEYALIAS: ${{ secrets.SHELLKEYALIAS }}
      SHELLKEYPASSWORD: ${{ secrets.SHELLKEYPASSWORD }}
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Decode keystore (optional)
        if: ${{ env.SHELLKEYSTOREBASE64 != '' }}
        run: |
          # 四个签名 Secret 必须同时存在，避免产出「半配置」的签名包
          missing=""
          [ -n "$SHELLKEYSTOREPASSWORD" ] || missing="$missing SHELLKEYSTOREPASSWORD"
          [ -n "$SHELLKEYALIAS" ] || missing="$missing SHELLKEYALIAS"
          [ -n "$SHELLKEYPASSWORD" ] || missing="$missing SHELLKEYPASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::签名配置不完整，缺少 Secret:$missing"
            exit 1
          fi
          # 密钥只落到 Runner 临时目录，不进入仓库工作区；
          # 值由 GitHub 自动打码，且这里不 echo 任何密钥内容，不会写入构建日志。
          printf '%s' "$SHELLKEYSTOREBASE64" | base64 --decode > "$RUNNER_TEMP/shell-release.jks"
          echo "SHELLKEYSTOREFILE=$RUNNER_TEMP/shell-release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        run: gradle -p android-shell assembleDebug assembleRelease

      - name: Verify release APK signature (optional)
        if: ${{ env.SHELLKEYSTOREBASE64 != '' }}
        run: |
          APK=android-shell/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::release APK 未生成"; exit 1; }
          SIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK"
          else
            echo "apksigner 未找到，跳过签名校验（不影响 APK 产出）"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-release
          path: android-shell/app/build/outputs/apk/release/*.apk
